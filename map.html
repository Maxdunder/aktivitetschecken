<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalistisk karta</title>

    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #f4f6f5;
            font-family: Arial, sans-serif;
        }

        .map-wrapper { width: 100%; height: 100%; padding: 15px; }

        .map-inner {
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 18px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }

        #map { width: 100%; height: 100%; }

        .maplibregl-ctrl-group {
            border: none !important;
            border-radius: 12px !important;
            overflow: hidden;
            box-shadow: 0 3px 15px rgba(0,0,0,0.12);
        }

        .location-marker {
            width: 25px;
            height: 25px;
            background: #176b45;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.95);
            box-shadow: 0 2px 8px rgba(0,0,0,0.20);
            cursor: pointer;
        }

        .user-location-marker {
            width: 30px;
            height: 30px;
            background: #0066cc;
            border-radius: 50%;
            border: 4px solid rgba(255,255,255,0.95);
            box-shadow: 0 2px 8px rgba(0,0,0,0.20);
            cursor: pointer;
        }

        .maplibregl-popup-content {
            padding: 15px 18px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="map-wrapper">
    <div class="map-inner">
        <div id="map"></div>
    </div>
</div>

<script>
    let map;

    // Initialize map with default center
    function initMap(center) {
        map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/liberty',
            center: center,
            zoom: 14
        });

        map.addControl(new maplibregl.NavigationControl(), 'top-right');

        map.on('error', (e) => console.error('Kartfel:', e.error));

        map.on('load', () => {
            styleMapLayers();
        });
    }

    function styleMapLayers() {
        for (const layer of map.getStyle().layers) {
            const id = layer.id.toLowerCase();

            try {
                if (layer.type === 'line' &&
                    (id.includes('road') || id.includes('street') || id.includes('highway'))) {
                    map.setPaintProperty(layer.id, 'line-color', '#d8dde0');
                    map.setPaintProperty(layer.id, 'line-opacity', 0.75);
                }
                if (layer.type === 'fill' &&
                    (id.includes('park') || id.includes('landuse') || id.includes('green'))) {
                    map.setPaintProperty(layer.id, 'fill-color', '#edf4ef');
                    map.setPaintProperty(layer.id, 'fill-opacity', 0.8);
                }
                if (layer.type === 'fill' &&
                    (id.includes('water') || id.includes('ocean') || id.includes('lake'))) {
                    map.setPaintProperty(layer.id, 'fill-color', '#edf7f8');
                    map.setPaintProperty(layer.id, 'fill-opacity', 0.9);
                }
                if (layer.type === 'fill' && id.includes('building')) {
                    map.setPaintProperty(layer.id, 'fill-color', '#f8f8f6');
                    map.setPaintProperty(layer.id, 'fill-opacity', 0.85);
                }
            } catch (e) {
                console.log('Kunde inte styla:', layer.id);
            }
        }
    }

    function addMarker(longitude, latitude, title) {
        const element = document.createElement('div');
        element.className = 'location-marker';

        const popup = new maplibregl.Popup({ offset: 18 })
            .setHTML(`<strong>${title}</strong>`);

        new maplibregl.Marker({ element })
            .setLngLat([longitude, latitude])
            .setPopup(popup)
            .addTo(map);
    }

    function addUserMarker(longitude, latitude) {
        const element = document.createElement('div');
        element.className = 'user-location-marker';

        const popup = new maplibregl.Popup({ offset: 20 })
            .setHTML(`<strong>Din plats</strong>`);

        new maplibregl.Marker({ element })
            .setLngLat([longitude, latitude])
            .setPopup(popup)
            .addTo(map);
    }

    // Get user's location
    function getUserLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const { latitude, longitude } = position.coords;
                    console.log('Användarposition:', latitude, longitude);
                    
                    // Initialize map with user's location
                    initMap([longitude, latitude]);
                    
                    // Add a marker for user's location
                    addUserMarker(longitude, latitude);
                    
                    // Add other markers
                    addMarker(11.974, 57.715, 'Plats 1');
                    addMarker(11.975, 57.700, 'Plats 2');
                },
                (error) => {
                    console.error('Kunde inte få användarposition:', error);
                    // Fallback to default center if geolocation fails
                    initMap([17.3147, 62.3898]);
                    addMarker(11.974, 57.715, 'Plats 1');
                    addMarker(11.975, 57.700, 'Plats 2');
                }
            );
        } else {
            console.error('Geolocation stöds inte av denna webbläsare');
            // Fallback to default center
            initMap([17.3147, 62.3898]);
            addMarker(11.974, 57.715, 'Plats 1');
            addMarker(11.975, 57.700, 'Plats 2');
        }
    }

    // Start the app
    getUserLocation();
</script>

</body>
</html>

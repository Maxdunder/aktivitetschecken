<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="../static/profile.css">
    <link rel="stylesheet" href="../static/menu.css">
    <script src="../static/menu.js" defer></script>
</head>
<body>
    {% if user %}
    <div class="layout">
        <!-- Sidebar menu -->
        <aside class="sidebar" id="sidebar">
            <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">‹</button>

            <div class="menu-section">
                <button class="section-header" aria-expanded="true">
                    <span class="label">Navigate</span>
                    <span class="chevron">⌃</span>
                </button>
                <ul class="section-items">
                    <li><a href="{{ url_for('index') }}"><span class="icon">🏠</span><span class="label">Activities</span></a></li>
                    <li><a href="{{ url_for('mat') }}"><span class="icon">🍽️</span><span class="label">Food</span></a></li>
                    <li><a href="#account"><span class="icon">👤</span><span class="label">Account</span></a></li>
                </ul>
            </div>
        </aside>
        <!-- Main content -->
        <main class="content">

            <!-- Everything below is inside one section called Account -->
            <div class="menu-section account" id="account">
                <button class="section-header" aria-expanded="true">
                    <span class="label">Account</span>
                    <span class="chevron">⌃</span>
                </button>

                <div class="section-items tall">

                    <header>
                        <button>Edit Profile</button>
                        <button>Activities</button>

                        <h1>{{user['name']}}'s Profile</h1>

                        <img src="{{ user['profile_picture'] or 'https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png' }}" alt="">
                    </header>

                    <section class="profile-settings">

                        <!-- Change username -->
                        <form method="POST">
                            <input type="hidden" name="action" value="username">

                            <label>Change Username</label>
                            <input type="text" name="changeusername" placeholder="{{user['name']}}" required>

                            <button type="submit">Confirm Username</button>
                        </form>

                        <!-- Change email -->
                        <form method="POST">
                            <input type="hidden" name="action" value="email">

                            <label>Change Email</label>
                            <input type="email" name="changeemail" placeholder="{{user['email']}}" required>

                            <button type="submit">Confirm Email</button>
                        </form>

                        <!-- Change phone number -->
                        <form method="POST">
                            <input type="hidden" name="action" value="phone">

                            <label>Change Phone number</label>
                            <input type="tel" name="changephone" placeholder="{{user['phone']}}" required>

                            <button type="submit">Confirm Phone</button>
                        </form>

                        <!-- Change password -->
                        <form method="POST">
                            <input type="hidden" name="action" value="password">

                            <label>New Password</label>
                            <input type="password" name="changepassword" placeholder="Password123" required>

                            <label>Confirm New Password</label>
                            <input type="password" name="confirmpassword" placeholder="Password123" required>

                            <button type="submit">Confirm Password</button>
                        </form>

                        <!-- Change company -->
                        <form method="POST">
                            <input type="hidden" name="action" value="company">

                            <label>Company Name</label>
                            <input type="text" placeholder="{{user['company'] or 'Company name'}}" name="companyname">

                            <button type="submit">Confirm Company</button>
                        </form>

                        <!-- Change profile picture -->
                        <form method="POST" enctype="multipart/form-data">
                            <input type="hidden" name="action" value="picture">

                            <label>Profile Picture</label>
                            <input type="file" name="profile_picture" accept="image/*" required>

                            <button type="submit">Upload Picture</button>
                        </form>

                    </section>
                </div>
            </div>

            <footer>
                <form action="{{ url_for('logout') }}" method="POST">
                    <button type="submit">Logout</button>
                </form>
            </footer>

        </main>
    </div>

    {% else %}
    <a href="{{ url_for('login') }}">Login</a>
    <a href="{{ url_for('registrera') }}">Register</a>
    {% endif %}

</body>
</html>

<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalistisk karta</title>
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Aktivitets Checken</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="aktivkarta.js" defer></script>
</head>

<body>
    <div class="header">
        <div class="sidetitle">
            <h2>Aktivitets Checken</h2>
        </div>
        <div class="aktivbuttoncont">
            <a class="aktivbutton active" href="gg.html" target="_blank">
                Aktivitets Checken
            </a>
            <a class="alkbutton" href="gg.html" target="_blank">
                Alkohol finder
            </a>
            <a class="matbutton" href="gg.html" target="_blank">
                Mat klippet
            </a>
        </div>
    </div>
    <div class="search">
        <form id="searchform">
            <div class="filtercont">
                <button id="filter" type="button" aria-expanded="false">filtrera</button>
                <div id="filterpanel" class="filterpanel" hidden></div>
            </div>
            <input type="search" id="searchinput" class="searchinput" placeholder="Sök aktivitet..." aria-label="Sök">
            <button type="submit">Sök</button>
        </form>
    </div>
    <div class="map-wrapper">
        <div class="map-inner">
            <div id="map"></div>
        </div>
    </div>
</body>
</html>

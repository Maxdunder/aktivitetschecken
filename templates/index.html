<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalistisk karta</title>
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Aktivitets Checken</title>
    <link rel="stylesheet" href="../static/indexstyle.css">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="../static/aktivkarta.js" defer></script>
</head>

<body>
    <div class="header">
        <div class="sidetitle">
           <img class="logo" src="/aktivitetschecken/images/Eventhub.png" />
        </div>

        <div class="aktivbuttoncont">
            <a class="aktivbutton active" href="{{ url_for('index') }}">
                Aktivitets Checken
            </a>
            <a class="alkbutton" href="gg.html" target="_blank">
                Alkohol finder
            </a>
            <a class="matbutton" href="{{ url_for('mat') }}">
                Mat klippet
            </a>
        </div>
        <div class="title">
            <h2>Event Hub</h2>
            <div class="dropdown">
                <button class="dropbtn">Dropdown</button>
                <div class="dropdown-content">
                    <a href="{{ url_for('profile') }}">profile</a>
                     <a href="{{ url_for('profiletest') }}">profile</a>
                    <a href="#">Link 3</a>
                </div>
            </div>
        </div>

    </div>
    <div class="search">
        <form id="searchform">
            <div class="filtercont">
                <button id="filter" type="button" aria-expanded="false">Filtrera</button>
                <div id="filterpanel" class="filterpanel" hidden></div>
            </div>
            <input type="search" id="searchinput" class="searchinput" placeholder="Sök aktivitet..." aria-label="Sök">
            <button id="searchbut" type="submit">Sök</button>
        </form>
    </div>
    <div class="mapshit">
        <div class="map-wrapper">
            <div class="map-inner">
                <div id="map"></div>
            </div>
        </div>
        <section class="activitytab" aria-label="Aktivitetsflöde">
            <div>
                <h2 class="feed-title">Aktiviteter nära dig</h2>
                <p class="feed-sub" id="feed-count"></p>
            </div>
            <div id="activity-list" class="activity-list"></div>
        </section>
    </div>
</body>
</html>
